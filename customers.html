{% extends "base.html" %}{% block title %}Customers{% endblock %}
{% block content %}
<h3 class="mb-3">Customers</h3>
<div class="row g-3">
  <div class="col-md-7">
    <div class="card p-3">
      <table class="table table-sm">
        <thead><tr><th>Name</th><th>Pricing</th><th>Discount</th><th>Zone</th></tr></thead>
        <tbody>
        {% for c in customers %}
        <tr><td>{{ c.name }}</td><td>{{ c.pricing_mode }}</td><td>{{ c.discount_pct }}%</td><td>{{ c.zone.name if c.zone else '—' }}</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  <div class="col-md-5">
    <div class="card p-3">
      <h5>Add customer</h5>
      <form method="post" action="{{ url_for('customer_new') }}">
        <div class="mb-2"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
        <div class="mb-2"><label class="form-label">Email</label><input class="form-control" name="email"></div>
        <div class="mb-2"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
        <div class="mb-2"><label class="form-label">Billing address</label><input class="form-control" name="billing_address"></div>
        <div class="mb-2"><label class="form-label">Pricing mode</label>
          <select class="form-select" name="pricing_mode" id="pm">
            <option value="standard">Standard (rate engine + discount)</option>
            <option value="flat">Flat rate per pallet</option>
          </select>
        </div>
        <div class="mb-2"><label class="form-label">Discount % (standard mode)</label>
          <input type="number" step="0.1" class="form-control" name="discount_pct" value="0"></div>
        <div class="mb-2"><label class="form-label">Flat £ per pallet (flat mode)</label>
          <input type="number" step="0.01" class="form-control" name="flat_rate_per_pallet" value="25"></div>
        <div class="mb-2"><label class="form-label">Zone</label>
          <select class="form-select" name="zone_id">
            <option value="">None</option>
            {% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}
          </select>
        </div>
        <hr>
        <div class="mb-2"><label class="form-label">Portal login email (optional)</label><input class="form-control" name="portal_email"></div>
        <div class="mb-2"><label class="form-label">Portal password</label><input class="form-control" name="portal_password" placeholder="changeme123"></div>
        <button class="btn btn-primary" type="submit">Add customer</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
