{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 class="mb-3">Hoya — Staff Sign In</h4>
      <form method="post">
        <div class="mb-3"><label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <hr>
      <div class="d-flex justify-content-between">
        <a href="{{ url_for('driver_login') }}">Driver login</a>
        <a href="{{ url_for('portal_login') }}">Customer portal</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
