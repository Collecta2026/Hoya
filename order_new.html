{% extends "base.html" %}
{% set wrap_class='narrow' %}
{% block title %}New job{% endblock %}
{% block body %}
<h1>New job</h1>
<div class="card">
<form method="post">
  <label>Job type</label>
  <select name="job_type" id="job_type">
    <option value="delivery">Delivery</option>
    <option value="collection">Collection</option>
  </select>
  <label>Customer</label>
  <select name="customer_id" id="customer_id" required>
    {% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
  </select>
  <div class="grid2">
    <div><label id="party_label">Recipient</label><input name="recipient"></div>
    <div><label>Phone</label><input name="phone" placeholder="07..."></div>
  </div>
  <label id="addr_label">Delivery address</label><input name="address">
  <div class="grid2">
    <div><label>Postcode</label><input name="postcode" id="postcode" required></div>
    <div><label>Service</label>
      <select name="service"><option>next-day</option><option>same-day</option><option value="am">AM window</option><option value="pm">PM window</option></select>
    </div>
  </div>
  <div class="grid2">
    <div><label>Parcels</label><input name="parcels" id="parcels" type="number" value="0" min="0"></div>
    <div><label>Pallets</label><input name="pallets" id="pallets" type="number" value="0" min="0"></div>
  </div>
  <label>Weight (kg)</label><input name="weight_kg" type="number" step="0.1" value="0">
  <label>Barcodes (optional — one per line; leave blank to auto-generate)</label>
  <textarea name="barcodes" rows="2" placeholder="e.g. 7350012340001"></textarea>
  <label>Notes</label><textarea name="notes" rows="2"></textarea>
  <p class="small muted" id="quote">Quote: enter customer & postcode</p>
  <button class="btn block big" style="margin-top:.6rem">Create job</button>
</form>
</div>
{% endblock %}
{% block scripts %}
<script>
const jt=document.getElementById('job_type');
function labels(){
  const col = jt.value==='collection';
  document.getElementById('party_label').textContent = col?'Collect from (contact)':'Recipient';
  document.getElementById('addr_label').textContent = col?'Collection address':'Delivery address';
}
jt.addEventListener('change',labels); labels();
async function quote(){
  const c=document.getElementById('customer_id').value;
  const pc=document.getElementById('postcode').value;
  const p=document.getElementById('pallets').value||0;
  if(!c||!pc){return;}
  const r=await fetch(`/api/quote?customer_id=${c}&postcode=${encodeURIComponent(pc)}&pallets=${p}`);
  const d=await r.json();
  document.getElementById('quote').textContent='Estimated charge: £'+d.price.toFixed(2);
}
['customer_id','postcode','pallets'].forEach(id=>document.getElementById(id).addEventListener('change',quote));
document.getElementById('postcode').addEventListener('blur',quote);
</script>
{% endblock %}
