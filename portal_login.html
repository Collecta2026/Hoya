{% extends "base.html" %}{% block title %}Customer Portal{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 class="mb-3">Customer Portal Sign In</h4>
      <form method="post">
        <div class="mb-3"><label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <a class="d-block mt-3 text-center" href="{{ url_for('login') }}">Staff sign in</a>
    </div>
  </div>
</div>
{% endblock %}
