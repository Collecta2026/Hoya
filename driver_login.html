{% extends "base.html" %}{% block title %}Driver Sign In{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3">Driver Sign In</h4>
      <form method="post">
        <div class="mb-3"><label class="form-label">Driver</label>
          <select name="driver_id" class="form-select" required>
            <option value="">Select your name…</option>
            {% for d in drivers %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="mb-3"><label class="form-label">PIN</label>
          <input type="password" inputmode="numeric" name="pin" class="form-control big-btn" required></div>
        <button class="btn btn-primary driver-pin-btn" type="submit">Sign in</button>
      </form>
      <a class="d-block mt-3 text-center" href="{{ url_for('login') }}">Staff sign in</a>
    </div>
  </div>
</div>
{% endblock %}
