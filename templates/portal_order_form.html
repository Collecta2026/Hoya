{% extends "base.html" %}{% block title %}New Order{% endblock %}
{% block content %}
<h3 class="mb-3">Place an order</h3>
<form method="post" class="card p-4" style="max-width:700px">
  <div class="mb-3"><label class="form-label">Job type</label>
    <select name="job_type" class="form-select"><option value="delivery">Delivery</option><option value="collection">Collection request (pickup)</option></select>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3"><label class="form-label">Collection address</label><input class="form-control" name="collection_address"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Collection postcode</label><input class="form-control" name="collection_postcode"></div>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3"><label class="form-label">Delivery address *</label><input class="form-control" name="delivery_address" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Delivery postcode *</label><input class="form-control" name="delivery_postcode" required></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Contact name</label><input class="form-control" name="contact_name" value="{{ customer.name }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Contact phone</label><input class="form-control" name="contact_phone"></div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">Pallets</label><input type="number" min="0" class="form-control" name="pallets" value="1"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Parcels</label><input type="number" min="0" class="form-control" name="parcels" value="0"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Weight per pallet (kg)</label><input type="number" step="0.1" class="form-control" name="weight_per_pallet_kg" value="0"></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Delivery date</label><input type="date" class="form-control" name="delivery_date" value="{{ today }}"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Timing</label>
      <select name="timing" class="form-select"><option value="48h" selected>48 hours</option><option value="same_day">Same day (before 11:00)</option><option value="booked">Booked slot</option></select>
    </div>
  </div>
  <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="2"></textarea></div>
  <button class="btn btn-primary" type="submit">Place order</button>
</form>
{% endblock %}
