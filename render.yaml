# Render blueprint for Hoya.
# Database: Neon Postgres (not Render's own managed Postgres) - paste the
# Neon POOLED connection string into DATABASE_URL after first deploy.
services:
  - type: web
    name: hoya
    env: python
    plan: starter
    region: frankfurt
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 3 --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "false"
      - key: DEPOT_POSTCODE
        value: "M1 1AA"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SALES_EMAIL
        value: "sales@heliolink.co.uk"
      - key: MAIL_FROM
        value: "noreply@heliolink.co.uk"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
