{% extends "base.html" %}{% block title %}New Order{% endblock %}
{% block content %}
<h3 class="mb-3">New Order</h3>
<form method="post" class="card p-4" style="max-width:760px">
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Customer</label>
      <select name="customer_id" class="form-select" required>
        {% for c in customers %}<option value="{{ c.id }}" {% if preselect_customer and preselect_customer==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3"><label class="form-label">Job type</label>
      <select name="job_type" class="form-select">
        <option value="delivery">Delivery</option>
        <option value="collection">Collection</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3"><label class="form-label">Collection address</label>
      <input class="form-control" name="collection_address"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Collection postcode</label>
      <input class="form-control" name="collection_postcode"></div>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3"><label class="form-label">Delivery address *</label>
      <input class="form-control" name="delivery_address" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Delivery postcode *</label>
      <input class="form-control" name="delivery_postcode" required placeholder="e.g. M1 1AA"></div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3"><label class="form-label">Contact name</label>
      <input class="form-control" name="contact_name"></div>
    <div class="col-md-6 mb-3"><label class="form-label">Contact phone</label>
      <input class="form-control" name="contact_phone"></div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3"><label class="form-label">Pallets</label>
      <input type="number" min="0" class="form-control" name="pallets" value="0"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Parcels</label>
      <input type="number" min="0" class="form-control" name="parcels" value="0"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Weight per pallet (kg)</label>
      <input type="number" step="0.1" class="form-control" name="weight_per_pallet_kg" value="0"></div>
    <div class="col-md-3 mb-3"><label class="form-label">Priority</label>
      <select name="priority" class="form-select"><option value="standard">Standard</option><option value="express">Express</option></select></div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">Collection date</label>
      <input type="date" class="form-control" name="collection_date"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Delivery date</label>
      <input type="date" class="form-control" name="delivery_date" value="{{ today }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Timing</label>
      <select name="timing" class="form-select">
        <option value="same_day">Same day</option>
        <option value="48h" selected>48 hours</option>
        <option value="booked">Booked slot</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">Cash on delivery amount (£, optional)</label>
      <input type="number" step="0.01" min="0" class="form-control" name="cod_amount" value="0"></div>
  </div>
  <div class="mb-3"><label class="form-label">Package notes</label>
    <textarea class="form-control" name="notes" rows="2"></textarea></div>
  <button class="btn btn-primary" type="submit">Create Order</button>
</form>
{% endblock %}
