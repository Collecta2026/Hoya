{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Customer portal{% endblock %}
{% block body %}
<div class="auth">
  <div class="box">
    <div class="brand">Vo<span>ya</span></div>
    <p class="muted small" style="text-align:center;margin-top:0">Customer order portal</p>
    <form method="post">
      <label>Account access code</label>
      <input name="code" required autofocus placeholder="e.g. ESOL2026">
      <button class="btn block big" style="margin-top:1rem">Continue</button>
    </form>
    <p class="small muted" style="text-align:center;margin-top:1rem">Staff? <a href="/login">Sign in here</a></p>
  </div>
</div>
{% endblock %}
