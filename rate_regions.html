{% extends "base.html" %}{% block title %}Regions & Zones{% endblock %}
{% block content %}
<h3 class="mb-3">Regions &amp; Zone Multipliers</h3>
<div class="row g-3">
  <div class="col-md-7">
    <div class="card p-3">
      <table class="table table-sm">
        <thead><tr><th>Zone</th><th>Postcode areas</th><th>Multiplier</th></tr></thead>
        <tbody>
        {% for z in zones %}
        <tr><td>{{ z.name }}</td><td class="small">{{ z.outward_prefixes }}</td><td>x{{ z.multiplier }}</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
  <div class="col-md-5">
    <form method="post" class="card p-3">
      <h5>Add zone</h5>
      <div class="mb-2"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
      <div class="mb-2"><label class="form-label">Postcode area prefixes (comma-separated)</label><input class="form-control" name="outward_prefixes" placeholder="e.g. EH,G,KA"></div>
      <div class="mb-2"><label class="form-label">Multiplier</label><input type="number" step="0.01" class="form-control" name="multiplier" value="1.0"></div>
      <button class="btn btn-primary" type="submit">Add zone</button>
    </form>
  </div>
</div>
{% endblock %}
